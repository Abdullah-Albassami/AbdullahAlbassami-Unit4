{% extends "base.html" %}

{% block title %}
Preferences | StudyHub
{% endblock %}

{% block content %}

<h2>Preferences</h2>

<div class="form-card">

    <p>
        Current theme:
        <strong>{{ theme|title }}</strong>
    </p>

    <form method="post">

        {% csrf_token %}

        <label for="theme">
            Select Theme
        </label>

        <select name="theme" id="theme">

            <option
                value="light"
                {% if theme == "light" %}selected{% endif %}
            >
                Light
            </option>

            <option
                value="dark"
                {% if theme == "dark" %}selected{% endif %}
            >
                Dark
            </option>

        </select>

        <button type="submit">
            Save Preference
        </button>

    </form>

</div>

{% endblock %}
