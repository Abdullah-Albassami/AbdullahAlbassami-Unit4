{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}StudyHub{% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    {% if theme == "dark" %}
        <link rel="stylesheet" href="{% static 'css/dark.css' %}">
    {% else %}
        <link rel="stylesheet" href="{% static 'css/light.css' %}">
    {% endif %}
</head>

<body class="{{ theme }}">

    <header>
        <div class="container">

            <div class="brand">
                <img
                    src="{% static 'images/logo.png' %}"
                    alt="StudyHub logo"
                    class="logo"
                >

                <h1>StudyHub</h1>
            </div>

            <nav>
                <a href="{% url 'core:home' %}">Home</a>
                <a href="{% url 'core:resource_list' %}">Resources</a>
                <a href="{% url 'core:favorites' %}">Favorites</a>
                <a href="{% url 'core:preferences' %}">Preferences</a>
                <a href="{% url 'core:feedback' %}">Feedback</a>
            </nav>

        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>StudyHub Learning Resources Portal</p>
        </div>
    </footer>

</body>

</html>
